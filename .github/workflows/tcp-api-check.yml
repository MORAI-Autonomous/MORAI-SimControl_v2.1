name: TCP API Check

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  tcp-api-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Verify generated TCP API docs
        run: python tools/gen_tcp_docs.py --check

      - name: Run TCP payload golden tests
        run: python -m unittest tests.test_tcp_payloads
